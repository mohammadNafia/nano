<!doctype html>
<html lang="en" dir="ltr">
	<head>
		<meta charset="utf-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1" />
		<title>Nano - AI-Powered OCR Text Extraction</title>
		<meta name="description" content="Extract text from images using AI-powered optical character recognition. Fast, accurate, and easy to integrate OCR service for documents, receipts, and more." />
		
		<!-- Preconnect to external domains for faster API calls -->
		<link rel="preconnect" href="https://ocr-main-ddl4dg.laravel.cloud" crossorigin />
		
		<!-- DNS prefetch for faster resource loading -->
		<link rel="dns-prefetch" href="https://ocr-main-ddl4dg.laravel.cloud" />
		
		<!-- Critical inline script - prevents theme flash -->
		<script>
			(function() {
				const stored = localStorage.getItem('theme');
				const prefersDark = window.matchMedia('(prefers-color-scheme: dark)').matches;
				const theme = stored || (prefersDark ? 'dark' : 'light');
				if (theme === 'dark') {
					document.documentElement.classList.add('dark');
				} else {
					document.documentElement.classList.remove('dark');
				}
			})();
		</script>
		%sveltekit.head%
	</head>
	<body data-sveltekit-preload-data="hover" data-sveltekit-preload-code="hover">
		<div style="display: contents">%sveltekit.body%</div>
	</body>
</html>
